<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/img/logo_form.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FORMidável</title>

    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <script>
      if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.classList.add('dark')
      } else {
        document.documentElement.classList.remove('dark')
      }
    </script>
  </head>
  <body class="min-h-screen flex flex-col bg-gray-50 dark:bg-dark-bg transition-colors duration-300">
    <div id="root" class="flex-grow flex flex-col w-full"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
