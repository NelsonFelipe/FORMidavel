{% extends 'base.html' %}

{% block meta %}
    <meta name="description" content="Crie um novo formulário.">
    <!-- Removido create_form.css antigo -->
    <script src="{{ url_for('static', filename='js/create_form.js')}}" defer></script>
    <title>Criar formulário</title>
{% endblock %}

{% block content %}

    <form action="{{ url_for('main.create_form') }}" method="POST" id="creation-form" class="w-full max-w-4xl mx-auto pb-20">

        <!-- Title and Description Card -->
        <div class="bg-white dark:bg-dark-card rounded-xl shadow-sm border-t-8 border-brand border-x border-b border-gray-200 dark:border-dark-border p-8 mb-8 form-header transition-colors">
            <input class="text-4xl font-bold text-gray-800 dark:text-white bg-transparent border-b-2 border-transparent hover:border-gray-200 dark:hover:border-gray-700 focus:border-brand focus:outline-none w-full py-2 transition-all placeholder-gray-300 dark:placeholder-gray-600 title" 
                   type="text" name="title" id="title" maxlength="100" required placeholder="Título do Formulário" data-testid="form-title-input">
            
            <textarea class="w-full mt-4 text-gray-600 dark:text-gray-300 bg-transparent text-base border-b border-transparent hover:border-gray-200 dark:hover:border-gray-700 focus:border-gray-300 dark:focus:border-gray-600 focus:outline-none resize-none py-2 transition-all description" 
                      name="description" id="description" rows="2" maxlength="500" required placeholder="Descrição do formulário" data-testid="form-desc-input"></textarea>
        </div>

        <div id="questions" class="space-y-6">

            <!-- Initial Question (must match JS) -->
            <div class="bg-white dark:bg-dark-card p-6 rounded-xl shadow-sm border border-gray-200 dark:border-dark-border mb-6 space-y-6 question relative group transition-colors" data-testid="question-item">
                
                <!-- Delete Button (Absolute) -->
                <button type="button" onclick="removeQuestion(this)" class="absolute top-4 right-4 text-gray-300 hover:text-red-500 dark:text-gray-600 dark:hover:text-red-400 transition-colors p-1 rounded-full hover:bg-red-50 dark:hover:bg-red-900/20" title="Excluir Pergunta" data-testid="delete-question-btn">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                    </svg>
                </button>

                <div class="flex flex-col md:flex-row gap-4 items-start justify-between quest-types pr-10">
                    <input type="text" class="flex-grow text-lg font-medium border-b-2 border-gray-200 dark:border-gray-700 focus:border-brand outline-none py-2 transition-colors bg-transparent text-gray-800 dark:text-white placeholder-gray-400 dark:placeholder-gray-600 question-text" name="quest" placeholder="Digite sua pergunta" required data-testid="question-text-input">
                    
                    <div class="relative min-w-[200px]">
                        <select name="type" class="block w-full appearance-none bg-white dark:bg-gray-800 border border-gray-300 dark:border-gray-600 text-gray-700 dark:text-gray-200 py-2 px-4 pr-8 rounded leading-tight focus:outline-none focus:border-brand focus:ring-1 focus:ring-brand question_type" required data-testid="question-type-select">
                            <option value="short_answer">Resposta Curta</option>
                            <option value="long_answer">Resposta Longa</option>
                            <option value="multiple_choice">Múltipla Escolha</option>
                            <option value="checkbox">Caixa de Seleção</option>
                        </select>
                        <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-2 text-gray-700 dark:text-gray-400">
                            <svg class="fill-current h-4 w-4" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20"><path d="M9.293 12.95l.707.707L15.657 8l-1.414-1.414L10 10.828 5.757 6.586 4.343 8z"/></svg>
                        </div>
                    </div>
                </div>

                <div class="options pl-2">
                    <input class="w-full border-b border-dotted border-gray-300 dark:border-gray-700 text-gray-500 dark:text-gray-500 py-2 bg-transparent inputs" type="text" maxlength="200" name="opcao" value="Texto de resposta curta" disabled>
                </div>
            </div>

        </div>

        <div class="div-btns flex flex-col sm:flex-row gap-4 mt-8 justify-between items-center">
            <button class="flex items-center gap-2 text-gray-600 dark:text-gray-400 hover:text-brand dark:hover:text-brand font-semibold py-2 px-4 rounded transition-colors" type="button" onclick="addQuestion()" data-testid="add-question-btn">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
                </svg>
                Adicionar Pergunta
            </button>

            <button class="bg-brand hover:bg-brand-hover text-white font-bold py-3 px-8 rounded-lg shadow-md transition-transform transform hover:scale-105" type="submit" data-testid="save-form-btn">
                Salvar Formulário
            </button>
        </div>

    </form>

{% endblock %}
