{% extends 'base.html' %}

{% block meta %}
    <title>Resposta Enviada - FORMidável</title>
{% endblock %}

{% block content %}
<div class="flex flex-col items-center justify-center min-h-[60vh]">
    <div class="bg-white dark:bg-dark-card p-10 md:p-16 rounded-[2.5rem] shadow-2xl shadow-gray-200/60 dark:shadow-none text-center max-w-lg border border-gray-50 dark:border-dark-border relative overflow-hidden transition-colors">
        
        <!-- Confetti Decorator -->
        <div class="absolute top-0 left-0 w-full h-2 bg-gradient-to-r from-brand to-green-400"></div>

        <div class="w-24 h-24 bg-green-50 dark:bg-green-900/20 text-brand rounded-full flex items-center justify-center mx-auto mb-8 animate-bounce">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-12 w-12" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7" />
            </svg>
        </div>
        
        <h1 class="text-3xl md:text-4xl font-bold text-gray-900 dark:text-white mb-4">Sucesso!</h1>
        <p class="text-lg text-gray-600 dark:text-gray-300 mb-10 leading-relaxed">
            Sua resposta para o formulário <br> 
            <strong class="text-gray-900 dark:text-white">"{{ form.title }}"</strong> <br>
            foi enviada com sucesso.
        </p>
        
        <div class="flex flex-col gap-4">
            <a href="{{ url_for('main.all_forms') }}" class="w-full bg-brand hover:bg-green-700 text-white font-bold py-3 px-6 rounded-xl transition-colors">
                Voltar para Meus Formulários
            </a>
            
            <a href="{{ url_for('main.view_form', form_id=form.id) }}" class="w-full bg-white dark:bg-transparent border-2 border-gray-200 dark:border-gray-600 hover:border-brand dark:hover:border-brand text-gray-600 dark:text-gray-300 hover:text-brand dark:hover:text-brand font-bold py-3 px-6 rounded-xl transition-colors">
                Enviar outra resposta
            </a>
            
            <a href="{{ url_for('main.create_form') }}" class="text-gray-400 hover:text-gray-600 dark:hover:text-gray-200 font-medium text-sm mt-2">
                Crie seu próprio formulário grátis
            </a>
        </div>
    </div>
</div>
{% endblock %}
