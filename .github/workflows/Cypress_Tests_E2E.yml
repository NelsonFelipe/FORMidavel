name: Cypress Tests E2E

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  cypress-run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 1. Backend Setup & Execution
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          cache: 'pip'
      
      - name: Install Backend Dependencies
        run: |
          cd backend
          pip install -r requirements.txt

      - name: Start Backend Server
        run: |
          cd backend
          python run_test.py &
        env:
          FLASK_ENV: testing

      # 2. Frontend Setup & Execution
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: Start Frontend Server
        run: |
          cd frontend
          # FORCE port 5173 and host 127.0.0.1 to ensure wait-on finds it
          npx vite --mode testing --port 5173 --host 127.0.0.1 &

      # 3. Cypress Execution
      - name: Cypress Run
        uses: cypress-io/github-action@v6
        with:
          working-directory: tests/e2e
          
          # Waiting for explicit IPv4 addresses on correct ports
          wait-on: 'http://127.0.0.1:5001/api/v1/forms, http://127.0.0.1:5173'
          wait-on-timeout: 120
          
          install: true
